services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ${HOME}/data/mpa:/data:cached
      - vsc-remote-containers:/workspaces/
    # ports:
    #   - "40000-40050:40000-40050/udp" # Ports for WebRTC / P2P connections

    # Keeps the container running so VS Code can attach
    command: sleep infinity

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak-server
    restart: unless-stopped
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=p@ssw0rd
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/server.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/server.key
      # Browser-facing URLs use the public hostname, while backchannel endpoints (token, jwks, ...)
      # follow the request host, so the backend can reach them via http://keycloak:8080.
      - KC_HOSTNAME=https://localhost:8443
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    command: start-dev
    volumes:
      - ~/data/mpa/https/:/opt/keycloak/conf/:ro
      - keycloak-data:/opt/keycloak/data/
      - ~/dev/org-on-register/out/org-on-register.jar:/opt/keycloak/providers/org-on-register.jar:ro
    ports:
      - "8080:8080"
      - "8443:8443"


volumes:
  vsc-remote-containers:
  keycloak-data:
    name: keycloak-data

